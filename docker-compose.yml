version: '3.8'

services:
  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: redis
    hostname: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    restart: always
    networks:
      - odoo19_odoo19-net

  # FastAPI Application
  api:
    build: .
    container_name: odoo_api
    hostname: odoo_api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - ODOO_URL=${ODOO_URL}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=${DEBUG}
    depends_on:
      - redis
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 3
    restart: always
    networks:
      - odoo19_odoo19-net

volumes:
  redis_data:

networks:
  odoo19_odoo19-net:
    external: true
