version: '3.8'

services:
  # Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    hostname: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: "bash -c 'echo > /dev/tcp/localhost/2181'"
    # volumes:
    #   - zk-data:/var/lib/zookeeper/data
    #   - zk-log:/var/lib/zookeeper/log
    restart: unless-stopped
    networks:
      - odoo19_odoo19-net

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    hostname: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # --- Listeners (VERY IMPORTANT) ---
      # KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # --- Topic & Replication (single broker safe) ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1

      # --- Log / Performance ---
      # KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # KAFKA_LOG_RETENTION_HOURS: 168
      # KAFKA_LOG_SEGMENT_BYTES: 1073741824

    # volumes:
    #   - kafka-data:/var/lib/kafka/data
    restart: always
    networks:
      - odoo19_odoo19-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      KAFKA_CLUSTERS_0_READONLY: "false"

      # KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: SASL_PLAINTEXT
      # KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM: PLAIN
      # KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG: |
      #   org.apache.kafka.common.security.plain.PlainLoginModule required
      #   username="admin"
      #   password="admin-secret";

    restart: unless-stopped
    networks:
      - odoo19_odoo19-net

  # Kafka Consumer Worker
  # kafka-consumer:
  #   build: .
  #   container_name: kafka_consumer
  #   hostname: kafka_consumer
  #   environment:
  #     - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
  #     - KAFKA_GROUP_ID=odoo-api-group
  #   depends_on:
  #     - kafka
  #   volumes:
  #     - .:/kafka
  #   command: python -m kafka.consumer_worker
  #   networks:
  #     - odoo19_odoo19-net

# volumes:
#   zk-data:
#   zk-log:
#   kafka-data:

networks:
  odoo19_odoo19-net:
    external: true
